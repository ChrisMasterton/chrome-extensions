<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — HikeStrong</title>
    <link rel="stylesheet" href="demo.css">
  </head>
  <body>
    <main class="demo-page">
      <section class="login-card" aria-labelledby="login-title">
        <div class="login-heading">
          <span>HIKESTRONG</span>
          <h1 id="login-title">Welcome back</h1>
          <p>Sign in to continue to your workspace.</p>
        </div>
        <form>
          <label>
            <span>Name</span>
            <input type="text" name="name" placeholder="Jane Tester">
          </label>
          <label>
            <span>Email</span>
            <input type="email" autocomplete="email" placeholder="you@example.com">
          </label>
          <label>
            <span>Password</span>
            <input type="password" autocomplete="current-password" placeholder="Enter your password">
          </label>
          <label>
            <span>Confirm password</span>
            <input type="password" autocomplete="new-password" placeholder="Repeat your password">
          </label>
          <button type="submit">Sign in</button>
        </form>
        <div class="login-divider"><span>or</span></div>
        <a href="#create-account">Create an account</a>
        <a href="profile.html">Try form snapshots on the profile page</a>
      </section>
    </main>
    <script src="../core.js"></script>
    <script src="../content.js"></script>
  </body>
</html>
